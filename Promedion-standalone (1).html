      window.Babel.transformScriptTags();

e=\"{{ showPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closePrivacy }}\" style=\"position:fixed;inset:0;z-index:300;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:48px 20px;background:rgba(2,6,13,0.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);\">\n      <div onclick=\"{{ stop }}\" style=\"position:relative;width:100%;max-width:760px;border-radius:20px;padding:56px clamp(24px,5vw,56px);background:linear-gradient(160deg, rgba(10,37,64,0.6), rgba(4,16,31,0.92));border:1px solid rgba(191,233,255,0.12);box-shadow:0 30px 90px rgba(2,10,22,0.7);\">\n        <button onclick=\"{{ closePrivacy }}\" aria-label=\"Zamknij\" style=\"position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:999px;border:1px solid rgba(201,214,228,0.2);background:none;cursor:pointer;color:#c9d6e4;font-size:18px;line-height:1;transition:border-color .4s,color .4s;\" style-hover=\"border-color:rgba(191,233,255,0.5);color:#eaf1f8;\">×<\u002Fbutton>\n        <span style=\"display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:0.4em;color:rgba(191,233,255,0.6);\">Informacje prawne · RODO<\u002Fspan>\n        <h2 style=\"margin:24px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(28px,4vw,40px);line-height:1.15;color:#eaf1f8;\">{{ docTitle }}<\u002Fh2>\n\n        <sc-if value=\"{{ isPrivacy }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid rgba(191,233,255,0.1);padding-bottom:20px;\">\n          <button onclick=\"{{ showPrivacyDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\">Polityka prywatności<span style=\"position:absolute;left:4px;right:4px;bottom:0;height:2px;background:#bfe9ff;\"><\u002Fspan><\u002Fbutton>\n          <button onclick=\"{{ showCookiesDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Polityka cookies<\u002Fbutton>\n          <button onclick=\"{{ showTermsDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Regulamin<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:24px;\">\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">1. Administrator danych<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Administratorem danych osobowych jest Jan Bujok (bmclinics.ai). W sprawach dotyczących ochrony danych osobowych możesz skontaktować się pod adresem <a href=\"mailto:drbujok@gmail.com\" style=\"color:#bfe9ff;text-decoration:underline;\">drbujok@gmail.com<\u002Fa> lub telefonicznie: 535 533 059.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">2. Cele i podstawa przetwarzania<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Dane przekazane w formularzu lub wiadomości e-mail przetwarzamy wyłącznie w celu odpowiedzi na zapytanie i nawiązania współpracy (art. 6 ust. 1 lit. b oraz lit. f RODO — prawnie uzasadniony interes administratora).<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">3. Okres przechowywania<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Dane przechowujemy przez okres niezbędny do realizacji celu, dla którego zostały zebrane, a po jego zakończeniu przez czas wymagany przepisami prawa lub do momentu wycofania zgody.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">4. Twoje prawa<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Masz prawo dostępu do swoich danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, przenoszenia danych oraz wniesienia sprzeciwu. Przysługuje Ci również prawo wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych (PUODO).<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">5. Odbiorcy i przekazywanie danych<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Dane mogą być powierzone podmiotom wspierającym działanie strony (hosting, narzędzia analityczne) wyłącznie w zakresie niezbędnym do świadczenia usług, na podstawie umów powierzenia przetwarzania danych. Dane nie są sprzedawane podmiotom trzecim.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCookies }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid rgba(191,233,255,0.1);padding-bottom:20px;\">\n          <button onclick=\"{{ showPrivacyDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Polityka prywatności<\u002Fbutton>\n          <button onclick=\"{{ showCookiesDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\">Polityka cookies<span style=\"position:absolute;left:4px;right:4px;bottom:0;height:2px;background:#bfe9ff;\"><\u002Fspan><\u002Fbutton>\n          <button onclick=\"{{ showTermsDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Regulamin<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:24px;\">\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">1. Czym są pliki cookies<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Pliki cookies to niewielkie pliki tekstowe zapisywane na Twoim urządzeniu podczas korzystania ze strony. Umożliwiają one prawidłowe działanie serwisu oraz analizę sposobu jego użytkowania.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">2. Rodzaje stosowanych cookies<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Stosujemy cookies niezbędne (wymagane do działania strony, nie wymagają zgody) oraz cookies analityczne i wydajnościowe (instalowane wyłącznie po wyrażeniu zgody), które pomagają nam zrozumieć, jak użytkownicy korzystają z serwisu.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">3. Zarządzanie zgodą<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Zgodę na cookies analityczne możesz w każdej chwili wycofać lub zmienić, klikając „Ustawienia cookies\" w stopce strony. Możesz także samodzielnie zarządzać plikami cookies w ustawieniach swojej przeglądarki, w tym całkowicie je zablokować.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTerms }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;border-bottom:1px solid rgba(191,233,255,0.1);padding-bottom:20px;\">\n          <button onclick=\"{{ showPrivacyDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Polityka prywatności<\u002Fbutton>\n          <button onclick=\"{{ showCookiesDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\" style-hover=\"color:#eaf1f8;\">Polityka cookies<\u002Fbutton>\n          <button onclick=\"{{ showTermsDoc }}\" style=\"position:relative;background:none;border:0;padding:8px 4px 14px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:rgba(201,214,228,0.85);transition:color .3s;\">Regulamin<span style=\"position:absolute;left:4px;right:4px;bottom:0;height:2px;background:#bfe9ff;\"><\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:28px;display:flex;flex-direction:column;gap:24px;\">\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">1. Postanowienia ogólne<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Niniejszy Regulamin określa zasady korzystania ze strony internetowej bmclinics.ai. Operatorem serwisu jest Jan Bujok (bmclinics.ai). Korzystanie ze strony oznacza akceptację postanowień Regulaminu.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">2. Charakter informacyjny<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Treści prezentowane na stronie mają charakter informacyjny i prezentacyjny. Nie stanowią oferty handlowej w rozumieniu art. 66 §1 Kodeksu cywilnego ani porady medycznej.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">3. Kontakt i zapytania<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Kontakt z operatorem odbywa się drogą elektroniczną (<a href=\"mailto:drbujok@gmail.com\" style=\"color:#bfe9ff;text-decoration:underline;\">drbujok@gmail.com<\u002Fa>) lub telefoniczną (535 533 059). Operator dokłada starań, aby odpowiedzieć na zapytania w możliwie najkrótszym terminie.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">4. Prawa autorskie<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Wszelkie treści, znaki graficzne i materiały zamieszczone na stronie są chronione prawem autorskim i należą do operatora. Ich kopiowanie lub wykorzystywanie bez zgody jest zabronione.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:20px;color:#eaf1f8;\">5. Reklamacje<\u002Fh3>\n            <p style=\"margin:10px 0 0;font-size:14px;font-weight:300;line-height:1.7;color:rgba(201,214,228,0.72);\">Uwagi dotyczące funkcjonowania strony można zgłaszać na adres e-mail operatora. Reklamacje rozpatrywane są w terminie do 14 dni od daty otrzymania zgłoszenia.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showManifest }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:400;overflow-y:auto;background:radial-gradient(120% 80% at 50% 0%, #0a2540 0%, #04101f 40%, #03060d 100%);\">\n      <div style=\"position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(24px,5vw,64px);background:linear-gradient(to bottom, rgba(4,16,31,0.92), rgba(4,16,31,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\">\n        <span style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;letter-spacing:0.04em;color:#eaf1f8;\">PRO<span style=\"color:#bfe9ff;\">MEDION<\u002Fspan><\u002Fspan>\n        <button onclick=\"{{ closeManifest }}\" style=\"display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgba(201,214,228,0.25);background:rgba(4,16,31,0.5);padding:11px 22px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.14em;color:#c9d6e4;transition:border-color .4s,color .4s;\" style-hover=\"border-color:rgba(191,233,255,0.5);color:#eaf1f8;\"><span style=\"font-size:15px;\">←<\u002Fspan>Powrót<\u002Fbutton>\n      <\u002Fdiv>\n      <article style=\"margin:0 auto;max-width:820px;padding:32px clamp(24px,5vw,64px) 140px;\">\n        <span style=\"display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:0.4em;color:rgba(191,233,255,0.6);\">Manifest kliniczny · pełna wersja<\u002Fspan>\n        <h1 style=\"margin:28px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(34px,5.5vw,60px);line-height:1.1;color:#eaf1f8;text-shadow:0 0 28px rgba(191,233,255,0.18);\">Wprowadzenie i parametryzacja metodologiczna procesu akwizycji obrazu<\u002Fh1>\n        <div style=\"margin-top:36px;height:1px;width:120px;background:linear-gradient(to right, rgba(191,233,255,0.6), transparent);\"><\u002Fdiv>\n\n        <p style=\"margin:40px 0 0;font-size:18px;font-weight:300;line-height:1.85;color:rgba(201,214,228,0.82);\">Niniejszy dokument stanowi wyczerpującą, wysoce obiektywną analizę dermatologiczną oraz kosmetologiczną, opartą w całości na ewaluacji znormalizowanego obrazu cyfrowego twarzy pacjenta. Proces akwizycji danych przestrzennych i barwnych został poddany rygorystycznej procedurze kalibracyjnej przy użyciu referencyjnej karty kolorystycznej (wzorzec przestrzeni barwnej X-Rite), zlokalizowanej w dolnej części pola obrazowania.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">1<\u002Fsup> Zastosowanie tego bezwzględnego standardu referencyjnego gwarantuje stuprocentową normalizację balansu bieli, optymalizację ekspozycji oraz wierność odwzorowania przestrzeni barw. Procedura ta całkowicie eliminuje ryzyko przekłamań sprzętowych, aberracji chromatycznych, dystorsji soczewki oraz artefaktów oświetleniowych, które nagminnie zniekształcają standardową fotografię kliniczną.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">1<\u002Fsup> W rezultacie zarejestrowane nasycenie barw, stopień zjawisk naczyniowych (erytemy) oraz dokładny rozkład pigmentu (melaniny) są traktowane jako twarde, bezwzględne dane diagnostyczne, pozwalające na ilościową analizę chromoforów tkankowych.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">1<\u002Fsup><\u002Fp>\n\n        <p style=\"margin:32px 0 0;font-size:18px;font-weight:300;line-height:1.85;color:rgba(201,214,228,0.82);\">System analizy wykorzystuje zaawansowane algorytmy mapowania topograficznego naskórka, czerpiąc z dziedziny profilometrii optycznej i stereofotogrametrii.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">5<\u002Fsup> Analiza odbicia światła, z wykorzystaniem modeli dwukierunkowej dystrybucji odbicia (BRDF — Bidirectional Reflectance Distribution Function), pozwala na separację światła spolaryzowanego i niespolaryzowanego.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">7<\u002Fsup> Umożliwia to precyzyjne odróżnienie sygnałów pochodzących z powierzchni warstwy rogowej (stratum corneum) od światła rozproszonego wstecznie (backscattered) z głębszych warstw naskórka i skóry właściwej.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">8<\u002Fsup> Skoncentrowano się na trzech głównych osiach patomorfologicznych: zaburzeniach strukturalnych macierzy zewnątrzkomórkowej tkanki łącznej pod postacią blizn atroficznych i hipertroficznych, zmianach w architekturze i geometrii jednostek pilosebacealnych (ujścia gruczołów łojowych) oraz parametrach fizyko-optycznych powierzchni naskórka, definiujących mikrorelief i teksturę.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">6<\u002Fsup> Bezpośrednie powiązanie wyekstrahowanych danych topograficznych z precyzyjną mapą stanu zapalnego (rumień pozapalny) i dyspigmentacji (hiperpigmentacja) pozwala na sformułowanie niezwykle dokładnego, ustrukturyzowanego obrazu klinicznego skóry, niezbędnego do planowania celowanych interwencji terapeutycznych.<sup style=\"font-size:0.62em;color:rgba(191,233,255,0.55);vertical-align:super;\">12<\u002Fsup><\u002Fp>\n\n        <div style=\"margin-top:64px;display:flex;justify-content:center;\">\n          <button onclick=\"{{ closeManifest }}\" style=\"border-radius:999px;border:1px solid rgba(201,214,228,0.25);background:rgba(4,16,31,0.5);padding:14px 32px;cursor:pointer;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:0.15em;color:#c9d6e4;transition:border-color .4s,color .4s;\" style-hover=\"border-color:rgba(191,233,255,0.5);color:#eaf1f8;\">← Powrót do strony<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;networkSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.9,&quot;min&quot;:0.2,&quot;max&quot;:3.5,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ruch sieci&quot;},&quot;networkAmplitude&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.6,&quot;min&quot;:0.5,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ruch sieci&quot;},&quot;networkCharacter&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;calm&quot;,&quot;living&quot;,&quot;turbulent&quot;],&quot;default&quot;:&quot;turbulent&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ruch sieci&quot;},&quot;networkSwirl&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.5,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ruch sieci&quot;}}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n  rootRef = React.createRef();\n\n  state = { cookieChoice: undefined, showPrivacy: false, activeDoc: 'privacy', showManifest: false };\n\n  renderVals() {\n    const doc = this.state.activeDoc;\n    const titles = { privacy: 'Polityka prywatności', cookies: 'Polityka cookies', terms: 'Regulamin' };\n    return {\n      canvasRef: this.canvasRef,\n      rootRef: this.rootRef,\n      showCookieBanner: this.state.cookieChoice === undefined ? false : this.state.cookieChoice === null,\n      showPrivacy: this.state.showPrivacy,\n      showManifest: this.state.showManifest,\n      openManifest: () => { this.setState({ showManifest: true }); try { window.scrollTo(0, 0); } catch (e) {} },\n      closeManifest: () => this.setState({ showManifest: false }),\n      docTitle: titles[doc] || titles.privacy,\n      isPrivacy: doc === 'privacy',\n      isCookies: doc === 'cookies',\n      isTerms: doc === 'terms',\n      notPrivacy: doc !== 'privacy',\n      notCookies: doc !== 'cookies',\n      notTerms: doc !== 'terms',\n      acceptCookies: () => this.setCookies('accepted'),\n      rejectCookies: () => this.setCookies('rejected'),\n      openCookies: () => { try { localStorage.removeItem('prom_cookie_consent'); } catch (e) {} this.setState({ cookieChoice: null }); },\n      openPrivacy: () => this.setState({ showPrivacy: true, activeDoc: 'privacy' }),\n      closePrivacy: () => this.setState({ showPrivacy: false }),\n      stop: (e) => e.stopPropagation(),\n      showPrivacyDoc: () => this.setState({ activeDoc: 'privacy' }),\n      showCookiesDoc: () => this.setState({ activeDoc: 'cookies' }),\n      showTermsDoc: () => this.setState({ activeDoc: 'terms' }),\n    };\n  }\n\n  setCookies(val) {\n    try { localStorage.setItem('prom_cookie_consent', val); } catch (e) {}\n    this.setState({ cookieChoice: val });\n  }\n\n  componentDidMount() {\n    let stored = null;\n    try { stored = localStorage.getItem('prom_cookie_consent'); } catch (e) {}\n    this.setState({ cookieChoice: stored });\n    this.initReveal();\n    this.initCanvas();\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._revealRaf) cancelAnimationFrame(this._revealRaf);\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n  }\n\n  initReveal() {\n    const root = this.rootRef.current || document;\n    const show = (el) => {\n      const d = parseFloat(el.getAttribute('data-reveal-delay') || '0');\n      el.style.transitionDelay = d + 's';\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n      el.setAttribute('data-revealed', '1');\n    };\n    const check = () => {\n      const els = Array.from(root.querySelectorAll('[data-reveal]:not([data-revealed])'));\n      if (!els.length) { this._revealRaf = null; return; }\n      const vh = window.innerHeight || 800;\n      els.forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.9 && r.bottom > 0) show(el);\n      });\n      this._revealRaf = requestAnimationFrame(check);\n    };\n    this._revealRaf = requestAnimationFrame(check);\n  }\n\n  initCanvas() {\n    const canvas = this.canvasRef.current;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n\n    const COLS = 42, ROWS = 26, WD = 22, HD = 13, N = COLS * ROWS, SPEED = 0.18;\n\n    // base grid + phase seeds\n    const bx = new Float32Array(N), by = new Float32Array(N), seeds = new Float32Array(N);\n    let p = 0;\n    for (let j = 0; j < ROWS; j++) {\n      for (let i = 0; i < COLS; i++) {\n        bx[p] = (i / (COLS - 1) - 0.5) * WD;\n        by[p] = (j / (ROWS - 1) - 0.5) * HD;\n        const r = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453;\n        seeds[p] = r - Math.floor(r);\n        p++;\n      }\n    }\n    const id = (i, j) => j * COLS + i;\n    // neighbor segments (pairs of node indices)\n    const seg = [];\n    for (let j = 0; j < ROWS; j++) {\n      for (let i = 0; i < COLS; i++) {\n        if (i < COLS - 1) seg.push(id(i, j), id(i + 1, j));\n        if (j < ROWS - 1) seg.push(id(i, j), id(i, j + 1));\n      }\n    }\n\n    // soft glow dot sprite\n    const dot = document.createElement('canvas');\n    dot.width = dot.height = 64;\n    const dctx = dot.getContext('2d');\n    const g = dctx.createRadialGradient(32, 32, 0, 32, 32, 32);\n    g.addColorStop(0, 'rgba(255,255,255,1)');\n    g.addColorStop(0.22, 'rgba(206,238,255,0.9)');\n    g.addColorStop(0.55, 'rgba(120,190,240,0.22)');\n    g.addColorStop(1, 'rgba(80,150,220,0)');\n    dctx.fillStyle = g;\n    dctx.fillRect(0, 0, 64, 64);\n\n    const sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N);\n    let W = 0, H = 0, dpr = 1;\n\n    const resize = () => {\n      const rect = canvas.getBoundingClientRect();\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      W = Math.max(1, rect.width);\n      H = Math.max(1, rect.height);\n      canvas.width = Math.round(W * dpr);\n      canvas.height = Math.round(H * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    };\n    this._onResize = resize;\n    resize();\n    window.addEventListener('resize', resize);\n\n    let last = performance.now();\n    this._t = this._t || 0;\n    const CHARS = { calm: [0, 0.30, 0.12], living: [0.5, 0.45, 0.22], turbulent: [1.15, 0.72, 0.36] };\n    const draw = (now) => {\n      const P = this.props || {};\n      const speedMul = P.networkSpeed != null ? P.networkSpeed : 1.4;\n      const ampMul = P.networkAmplitude != null ? P.networkAmplitude : 1.3;\n      const swirl = P.networkSwirl != null ? P.networkSwirl : 1;\n      const C = CHARS[P.networkCharacter] || CHARS.living;\n      const turb = C[0], bf = C[1], bvar = C[2];\n\n      const dt = Math.min(0.05, (now - last) / 1000);\n      last = now;\n      this._t += dt * SPEED * speedMul;\n      const t = this._t;\n\n      const breath = (1 - bvar) + bvar * Math.sin(t * bf);\n      // gentle whole-mesh drift so the field is never static\n      const swayX = Math.sin(t * 0.13) * W * 0.014 * swirl;\n      const swayY = Math.cos(t * 0.10) * H * 0.014 * swirl;\n      const rot = Math.sin(t * 0.08) * 0.05 * swirl;\n      const cs = Math.cos(rot), sn = Math.sin(rot);\n      const cx = W / 2 + swayX, cy = H / 2 + swayY;\n      const scale = Math.max(W / 19, H / 10.5);\n\n      for (let n = 0; n < N; n++) {\n        const x0 = bx[n], y0 = by[n], ph = seeds[n] * 6.2831;\n        let z = (Math.sin(t + x0 * 0.4 + ph) * 1.3 + Math.sin(t * 0.68 - y0 * 0.55 + ph * 0.5) * 0.95) * breath;\n        let dx = Math.sin(t * 0.5 + y0 * 0.4 + ph) * 0.22 * breath;\n        let dy = Math.cos(t * 0.42 + x0 * 0.32 + ph) * 0.18 * breath;\n        if (turb) {\n          z += Math.sin(t * 2.3 + x0 * 1.1 - y0 * 0.7 + ph * 1.7) * 0.9 * turb;\n          dx += Math.sin(t * 1.9 + y0 * 1.3 + ph * 2.1) * 0.16 * turb;\n          dy += Math.cos(t * 1.7 + x0 * 1.05 + ph * 1.4) * 0.14 * turb;\n        }\n        z *= ampMul; dx *= ampMul; dy *= ampMul;\n        // slow swirl rotation of the whole lattice\n        const rx = (x0 + dx) * cs - (y0 + dy) * sn;\n        const ry = (x0 + dx) * sn + (y0 + dy) * cs;\n        const persp = 1 + z * 0.014;\n        sx[n] = cx + rx * scale * persp;\n        sy[n] = cy + ry * scale * persp;\n        sz[n] = z;\n      }\n\n      // background deep-ocean gradient\n      const bg = ctx.createRadialGradient(cx, -H * 0.1, 0, cx, -H * 0.1, Math.max(W, H) * 1.25);\n      bg.addColorStop(0, '#0a2540');\n      bg.addColorStop(0.38, '#04101f');\n      bg.addColorStop(0.7, '#020a16');\n      bg.addColorStop(1, '#03060d');\n      ctx.fillStyle = bg;\n      ctx.fillRect(0, 0, W, H);\n\n      ctx.globalCompositeOperation = 'lighter';\n\n      // mesh lines (single batched path)\n      ctx.beginPath();\n      for (let s = 0; s < seg.length; s += 2) {\n        const a = seg[s], b = seg[s + 1];\n        ctx.moveTo(sx[a], sy[a]);\n        ctx.lineTo(sx[b], sy[b]);\n      }\n      ctx.lineWidth = 1;\n      ctx.strokeStyle = 'rgba(134,205,247,0.32)';\n      ctx.stroke();\n\n      // glowing nodes\n      for (let n = 0; n < N; n++) {\n        const z = sz[n];\n        const size = scale * (0.36 + z * 0.05);\n        if (size <= 0) continue;\n        ctx.globalAlpha = Math.max(0.18, Math.min(1, 0.62 + z * 0.16));\n        ctx.drawImage(dot, sx[n] - size / 2, sy[n] - size / 2, size, size);\n      }\n      ctx.globalAlpha = 1;\n      ctx.globalCompositeOperation = 'source-over';\n\n      this._raf = requestAnimationFrame(draw);\n    };\n    this._raf = requestAnimationFrame(draw);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
